<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Las Olas — Reseña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Public Sans', sans-serif;
    background:linear-gradient(160deg,#082C43 0%,#155A78 55%,#2E93A8 100%);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
    text-align:center;
    color:#fff;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:26px;
    margin-bottom:10px;
    max-width:300px;
  }
  p{
    opacity:.8;
    font-size:14px;
    margin-bottom:32px;
    max-width:280px;
  }
  a.btn{
    display:inline-block;
    background:#fff;
    color:#082C43;
    font-weight:600;
    font-size:16px;
    padding:18px 36px;
    border-radius:16px;
    text-decoration:none;
    box-shadow:0 12px 30px -10px rgba(0,0,0,.4);
  }
  .hint{
    margin-top:22px;
    font-size:12px;
    opacity:.55;
  }
</style>
</head>
<body>
  <h1>Gracias por venir a Las Olas</h1>
  <p>Toca el botón para dejarnos tu reseña en Google.</p>
  <a class="btn" id="review-link" href="https://search.google.com/local/writereview?placeid=ChIJXc3cPiSFzoYR2NyJLhmQIGg">
    Escribir reseña ⭐
  </a>
  <div class="hint">Se abrirá en tu navegador</div>

<script>
  // Fuerza la navegación por JS en vez de solo el href,
  // para asegurar que abra en el navegador completo del sistema.
  document.getElementById('review-link').addEventListener('click', function(e){
    e.preventDefault();
    window.location.href = this.href;
  });
</script>
</body>
</html>
